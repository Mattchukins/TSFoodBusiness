name: NUI static and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/syntax.lua
      - run: lua5.4 tests/operations.lua
      - run: lua5.4 tests/presets.lua
      - run: lua5.4 tests/business_creation.lua
      - run: lua5.4 tests/recipes.lua
      - run: lua5.4 tests/schema.lua
      - run: lua5.4 tests/stations.lua
      - run: lua5.4 tests/production.lua
      - run: lua5.4 tests/inventory.lua
      - run: lua5.4 tests/jobs.lua
      - run: lua5.4 tests/jobs_requests.lua
      - run: lua5.4 tests/staff.lua
      - run: lua5.4 tests/staff_disconnect.lua
      - run: lua5.4 tests/inventory_mutations.lua
      - run: lua5.4 tests/inventory_stateful_contract.lua
      - run: python3 tests/sql_contract.py
  nui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
