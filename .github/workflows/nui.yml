name: NUI static and build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: lua5.4 tests/syntax.lua
      - run: lua5.4 tests/operations.lua
      - run: lua5.4 tests/presets.lua
      - run: lua5.4 tests/business_creation.lua
      - run: lua5.4 tests/recipes.lua
      - run: lua5.4 tests/schema.lua
      - run: lua5.4 tests/stations.lua
      - run: lua5.4 tests/production.lua
      - run: lua5.4 tests/inventory.lua
      - run: lua5.4 tests/jobs.lua
      - run: lua5.4 tests/jobs_requests.lua
      - run: lua5.4 tests/staff.lua
      - run: lua5.4 tests/staff_disconnect.lua
      - run: lua5.4 tests/inventory_mutations.lua
      - run: lua5.4 tests/inventory_stateful_contract.lua
      - run: lua5.4 tests/ox_inventory_adapter.lua
      - run: lua5.4 tests/ox_production_journal.lua
      - run: lua5.4 tests/ox_stock_engine.lua
      - run: python3 tests/sql_contract.py
  mysql-stock:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-password"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: root
      MYSQL_PASSWORD: test-root-password
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: bash tests/ox_stock_mysql.sh
  nui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
